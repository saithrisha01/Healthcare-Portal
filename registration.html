<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container mt-5">


<h2 class="text-center mb-4">
Patient Registration Form
</h2>



<form id="registrationForm" class="card p-4">


<label>Patient Name</label>
<input type="text" id="name" class="form-control" required>



<label>Email</label>
<input type="email" id="email" class="form-control" required>



<label>Mobile Number</label>
<input type="tel" id="mobile" class="form-control" required>



<label>Date of Birth</label>
<input type="date" id="dob" class="form-control" required>



<label>Gender</label>

<select id="gender" class="form-control" required>

<option value="">
Select Gender
</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>




<label>Blood Group</label>

<select id="blood" class="form-control">

<option>Select Blood Group</option>

<option>A+</option>

<option>B+</option>

<option>AB+</option>

<option>O+</option>

</select>




<label>Department</label>

<select id="department" class="form-control" required>


<option value="">
Select Department
</option>


<option>Cardiology</option>

<option>Neurology</option>

<option>Dermatology</option>

<option>Orthopedics</option>

<option>Pediatrics</option>

<option>General Medicine</option>


</select>




<label>Doctor</label>


<select id="doctor" class="form-control" required>

<option value="">
Select Doctor
</option>

</select>




<label>Appointment Date</label>

<input type="date" id="date" class="form-control" required>



<label>Appointment Time</label>

<input type="time" id="time" class="form-control" required>




<label>Address</label>

<textarea id="address" class="form-control"></textarea>




<label>Symptoms</label>

<textarea id="symptoms" class="form-control"></textarea>



<br>


<button type="submit" class="btn btn-primary">

Register

</button>


<button type="reset" class="btn btn-danger">

Reset

</button>


</form>


</div>



<script src="script.js"></script>


</body>

</html>
